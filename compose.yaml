services:
  db:
    # Pinned to a major version: moving between majors requires migrating data.
    image: postgres:18
    environment:
      # The :? syntax stops with a clear error if a value is missing from .env.
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to 127.0.0.1 so only this machine can reach the database.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep their data under this path, not .../data.
      - db-data:/var/lib/postgresql
    healthcheck:
      # $$ passes a literal $ through, so the container fills in its own values.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Inside Compose's network, the database is reached by its service name.
      # The double underscore maps to the ConnectionStrings:Savepoint setting.
      ConnectionStrings__Savepoint: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      # Bound to 127.0.0.1 so only this machine can reach the API.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      # Bound to 127.0.0.1 so only this machine can reach the app. Port 3000
      # leaves 5173 free for running the Vite dev server at the same time.
      - "127.0.0.1:3000:8080"
    depends_on:
      - backend

volumes:
  db-data:
