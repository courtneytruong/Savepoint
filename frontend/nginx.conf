server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS server. Looking the backend up regularly means nginx finds
    # it again if a rebuild gives it a new IP address.
    resolver 127.0.0.11 valid=10s;

    location = /health {
        # Using a variable makes nginx look the name up at request time, rather
        # than only once at startup.
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    location / {
        # Paths that aren't files get the app, so client-side pages can be
        # opened directly or reloaded.
        try_files $uri /index.html;
    }
}
